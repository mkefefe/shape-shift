<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e33"><title>Shape Shift Battle</title><link rel="preload" as="image" href="assets/shapes-v2.webp"><link rel="preload" as="image" href="assets/monsters-v143/01.webp"><link rel="stylesheet" href="style.css?v=494200"><style>#app[data-loading="true"]{visibility:hidden}#enemy:not([style]){background-image:none!important}</style></head>
<body><main id="app" data-loading="true">
 <header><button id="pause" class="round" aria-label="Pause"><img src="../assets/pause-v30.webp" alt=""></button><div class="brand">BATTLE</div><button id="sound" hidden class="round" aria-label="Mute audio"><img src="../assets/delivery-v144/settings-v351.webp" alt="Sound"></button></header>
 <section class="player"><div class="identity"><div id="color-change-cue" role="progressbar" aria-label="Turns until color changes" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><i></i><i></i><i></i></div><div id="current" class="shape"></div><div><small>YOU ARE</small><strong id="current-name"></strong></div></div><div class="health"><span id="hearts" aria-label="Your health"></span><small id="guard"></small></div></section>
 <nav id="journey" aria-label="Journey progress"></nav>
 <section class="arena" aria-label="Enemy encounter">
  <div class="enemy-heading"><span id="chapter"></span><h1 id="enemy-name"></h1></div>
  <div class="enemy-health"><div id="enemy-fill"></div><span id="enemy-hp"></span></div>
  <div id="enemy-anchor"><div id="enemy" role="img"></div><button id="guard-tap" aria-label="Time a tap to block the enemy attack"><img src="../assets/delivery-v144/browser-shield-hd1.webp" alt=""><span>Tap shield</span></button><div class="ground"></div></div>
  <div id="weakness"></div>
  <div class="attack-meter"><div id="attack-fill"></div><span id="attack-text">Your first match starts the fight</span></div>
 </section>

 <div id="callout" role="status">Same shape OR color. Every match attacks!</div>
 <section id="board" aria-label="Choose a matching shape"></section>

 <div id="fx" aria-hidden="true"></div>
 <dialog id="overlay"><div id="panel"></div></dialog>
 </main><script type="module" src="app.mjs?v=494200"></script></body></html>
