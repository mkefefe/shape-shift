<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shape Shift</title>

<link rel="stylesheet" href="browser-cursor.css?v=49468">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063d5d}
.backdrop{position:fixed;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(18px) brightness(.42);pointer-events:none;user-select:none}
main{position:relative;display:flex;justify-content:center;align-items:center;width:100%;height:100dvh}
iframe{display:block;width:100%;height:100%;border:0;background:#063d5d;box-shadow:0 0 48px #001d40;isolation:isolate}
@media(min-width:600px){iframe{width:min(480px,62.5dvh);height:100dvh}}
#keyboard-help,#keyboard-help-toggle{display:none}
@media(min-width:1000px) and (hover:hover) and (pointer:fine){
 #keyboard-help:not([hidden]),#keyboard-help-toggle:not([hidden]){display:block;position:fixed;z-index:2;left:max(20px,calc((100vw - min(480px,62.5dvh))/4 - 110px));top:50%;transform:translateY(-50%);box-sizing:border-box;width:220px;color:#f5fcff;background:#07394ee8;border:1px solid #a4e9ff65;border-radius:18px;box-shadow:0 8px 28px #001c3a44;font:600 14px/1.4 system-ui,sans-serif}
 #keyboard-help{padding:20px 18px}#keyboard-help h2{margin:0;font-size:17px}#keyboard-help button{position:absolute;right:14px;top:18px;padding:3px 6px;color:#bfefff;background:transparent;border:0;font:inherit;font-size:12px;border-radius:5px}
 #keyboard-help .keyboard-help-context{margin:5px 0 20px;color:#bfe5ef;font-size:12px}#keyboard-help dl{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px 12px;margin:0}#keyboard-help dt,#keyboard-help dd{margin:0}#keyboard-help dd{font-size:12px}#keyboard-help kbd{display:inline-block;padding:5px 7px;min-width:22px;box-sizing:border-box;border-radius:6px;background:#14566c;border:1px solid #80bbcd;color:#fff;text-align:center;font:700 12px/1.2 system-ui,sans-serif;white-space:nowrap}
 #keyboard-help-toggle{padding:12px 18px}#keyboard-help button:focus-visible,#keyboard-help-toggle:focus-visible{outline:3px solid #ffe383;outline-offset:4px}
}
</style></head><body><img class="backdrop" data-src="assets/home-world-v101.webp" alt="" aria-hidden="true"><main><iframe src="game-frame.html?v=49484" title="Shape Shift game" allow="autoplay" onload="this.contentWindow.focus()"></iframe></main><script type="module" src="shell-keyboard.js?v=49483"></script><script>addEventListener('message',e=>{if(e.source===document.querySelector('iframe').contentWindow&&e.data==='shape-shift-ready'){const bg=document.querySelector('.backdrop');bg.src=bg.dataset.src;}},{once:false});</script></body></html>
