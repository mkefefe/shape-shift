name: Publish Shape Shift
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify gameplay
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Restore verified game bundle
        run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4


